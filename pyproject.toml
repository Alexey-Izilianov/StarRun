[project]
name = "starrun"
version = "0.1.0"
description = "Top-down выживалка: десантник против жуков"
requires-python = ">=3.13"
dependencies = [
    "arcade>=3.3",
    "numpy>=2.3",
]

[project.scripts]
starrun = "starrun.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starrun"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
    "mypy>=1.18",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PERF"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_return_any = false  # NumPy возвращает Any почти везде — шум, а не ошибки

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
