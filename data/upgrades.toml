# Улучшения за уровень. mode = "mult": характеристика × (1 + бонус редкости);
# mode = "add": + value × (бонус редкости / бонус обычной), integer — округлить вверх.
# group: weapon — оружие и способность, passive — десантник.
# weapon = "<id>": улучшение конкретного ствола — предлагается, только если он в слоте;
# каждое такое улучшение поднимает уровень ствола (до 5, на 5-м — карточка модификации).
# Карточки «Новое оружие» и «Модификация» собираются из weapons.toml сами.

